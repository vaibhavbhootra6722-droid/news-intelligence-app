name: news-bundle
on:
  schedule: [{ cron: "*/20 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: bundle
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/bundle.mjs
      - name: publish to data branch
        run: |
          cd out && git init -q -b data && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add bundle.json && git commit -qm "bundle $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
